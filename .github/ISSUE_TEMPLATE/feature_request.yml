name: Feature request
description: Suggest a focused improvement for SoleilCode
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this feature improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the command, interface, or behavior you would like.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Free-first policy
      options:
        - label: This proposal preserves SoleilCode's free-first and approval-by-default principles.
          required: true
